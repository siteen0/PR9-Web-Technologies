
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Різні форми об'єктів</title>
<style>
body {font-family:Arial;text-align:center;background:#eee}
#area {width:700px;height:400px;border:3px solid black;background:white;margin:30px auto;position:relative}
.object {position:absolute;cursor:grab;touch-action:none}
.square {width:90px;height:90px;background:rgba(255,0,0,0.5);left:50px;top:50px}
.circle {width:100px;height:100px;border-radius:50%;background:rgba(0,0,255,0.5);left:220px;top:50px}
.triangle {width:0;height:0;border-left:55px solid transparent;border-right:55px solid transparent;border-bottom:100px solid rgba(0,200,0,0.5);left:420px;top:50px}
</style>
</head>
<body>
<h1>Переміщення об'єктів різної форми</h1>
<p>Перетягуйте фігури мишкою.</p>
<div id="area">
<div class="object square"></div>
<div class="object circle"></div>
<div class="object triangle"></div>
</div>
<script>
const area=document.getElementById("area");
document.querySelectorAll(".object").forEach(obj=>{
obj.addEventListener("pointerdown",e=>{
e.preventDefault();
const r=obj.getBoundingClientRect();
const dx=e.clientX-r.left,dy=e.clientY-r.top;
obj.setPointerCapture(e.pointerId);
function move(e){
const a=area.getBoundingClientRect();
obj.style.left=Math.max(0,Math.min(area.clientWidth-obj.offsetWidth,e.clientX-a.left-dx))+"px";
obj.style.top=Math.max(0,Math.min(area.clientHeight-obj.offsetHeight,e.clientY-a.top-dy))+"px";
}
function stop(){obj.removeEventListener("pointermove",move)}
obj.addEventListener("pointermove",move);
obj.addEventListener("pointerup",stop,{once:true});
obj.addEventListener("pointercancel",stop,{once:true});
});
});
</script>
</body>
</html>
